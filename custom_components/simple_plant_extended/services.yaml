add_note:
  name: Add note
  description: Add a note to the plant timeline and fire a logbook entry.
  fields:
    entity_id:
      name: Entity
      description: Any Simple Plant entity for the target plant.
      required: true
      selector:
        entity: {}
    note:
      name: Note
      description: The note text to append.
      required: true
      selector:
        text:
          multiline: true

reload:
  name: Reload
  description: Reload Simple Plant Extended (all entries or a specific entity).
  fields:
    entity_id:
      name: Entity
      description: Optional entity to reload only the related plant entry.
      required: false
      selector:
        entity: {}

clear_logs:
  name: Clear logs
  description: Remove activity and notes logs older than the selected period (or all).
  fields:
    period:
      name: Period
      description: Age of entries to keep. Older entries will be removed.
      required: true
      selector:
        select:
          options:
            - label: Older than 3 months
              value: 3_months
            - label: Older than 6 months
              value: 6_months
            - label: Older than 1 year
              value: 1_year
            - label: All
              value: all

update_config:
  name: Update config
  description: Update plant configuration values (acquisition date and linked sensors).
  fields:
    entity_id:
      name: Entity
      description: Any Simple Plant entity for the target plant.
      required: true
      selector:
        entity: {}
    acquisition_date:
      name: Acquisition date
      description: Plant acquisition date (YYYY-MM-DD). Empty clears the value.
      required: false
      selector:
        text: {}
    humidity_sensor:
      name: Humidity sensor
      description: Entity ID for humidity sensor. Empty clears the value.
      required: false
      selector:
        entity: {}
    temperature_sensor:
      name: Temperature sensor
      description: Entity ID for temperature sensor. Empty clears the value.
      required: false
      selector:
        entity: {}
    light_sensor:
      name: Light sensor
      description: Entity ID for light sensor. Empty clears the value.
      required: false
      selector:
        entity: {}